spring.application.name=demo

# Configuração do banco via variáveis de ambiente (com valores padrão para uso local).
# No CI (GitHub Actions) essas variáveis são sobrescritas para apontar para o MySQL do pipeline.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sqa_social_media}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:shadow}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
